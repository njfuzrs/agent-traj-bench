name: bench-gates

# 题集门禁六条。全部 $0：不跑模型、不起容器、不需要快照。
#
# 🔴 每条门禁的**作用域与模式都是实测收窄过的**，⛔ 改宽之前先读注释里的「为什么不能」——
# 两条宽写法都会让门禁永远红，然后被人加 `|| true` 关掉，那比没有门禁更糟。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # 🔴 `fetch-depth: 0` 是门禁⑥ 的前提：checkout@v4 默认 depth=1，
      # 那样 `git rev-list --all` 只有 1 个提交 ⇒ 门禁⑥ 会**永远绿**而什么都没扫。
      # ⛔ 别为了省几秒把它改回默认值（本仓 66 提交 / 1.8k 对象，实测 6~13 秒）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ── 门禁① 题数 = 39 ────────────────────────────────────────────
      # 防「又把 65 条搬回来」：26 条在 T6 复核里被淘汰，留在私有仓归档。
      - name: gate1 - 题数必须是 39
        run: |
          n=$(find tasks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "tasks/ 条数: $n"
          test "$n" -eq 39 || { echo "::error::期望 39 条，实得 $n"; exit 1; }

      # ── 门禁② harbor 认格式 39/39 ──────────────────────────────────
      # 上游的接入契约。⚠️ 它只验 harbor 认不认 task 目录结构，
      # ⛔ 不验脚本能不能跑 —— 那是门禁④ 与单测的事（典型假绿，见 P1-1）。
      #
      # 🔴 版本必须钉死 == version.json 的 execution_base（harbor 0.22.0）：
      # 裸 `pip install harbor` 装的是最新版，而**这个 import 路径本身就搬过一次家**
      # （0.22 之前是 `harbor.task`，现在是 `harbor.models.task.task`）
      # ⇒ 上游再搬一次时门禁会以 ImportError 报红，形态是「题集看着坏了」，
      # 而真实原因是 CI 装了一个与冻结版本不同的 harbor。⛔ 别把它改回浮动版本。
      - name: gate2 - harbor Task.is_valid_dir 39/39
        run: |
          pip install --quiet 'harbor==0.22.0'
          python - <<'PY'
          import sys
          from pathlib import Path
          from harbor.models.task.task import Task
          tasks = sorted(p for p in Path("tasks").iterdir() if p.is_dir())
          bad = [t.name for t in tasks if not Task.is_valid_dir(t)]
          print(f"Task.is_valid_dir: {len(tasks) - len(bad)}/{len(tasks)}")
          if bad:
              print(f"::error::harbor 不认这些 task: {bad[:8]}")
              sys.exit(1)
          PY

      # ── 门禁③ 内网基建地址归零 ─────────────────────────────────────
      # 🔴 模式必须收窄到内网基建，⛔ 不许写 `\.ruijie\.com\.cn`：
      # 那会误伤 tasks/T0056/tests/test_patch.diff（公开 API 端点，且在 F2P 判分补丁里）
      # ⇒ 一个写错的门禁会**逼着下一个人去改判分口径**。宁可窄一点。
      #
      # ⚠️ 排除 .pytest_cache/.ruff_cache（③④⑤⑧ 四条工作树门禁都加了，理由同一条）：
      #   grep 走**文件系统**，不认 .gitignore ⇒ 本地跑过 pytest 之后，缓存里的
      #   `nodeids` 会把 parametrize 的入参原样写进去（实测 pipeline/tests/test_s0.py:69
      #   那条私有仓路径 fixture 就这么进了 .pytest_cache/v/cache/nodeids）。
      #   CI 是全新 checkout ⇒ 永远绿；本地跑过单测 ⇒ 报红。**同一条门禁两地不同结论**
      #   是最容易被 `|| true` 关掉的形态，所以把作用域对齐到「会被提交的文件」。
      #   ⛔ 别改成扫 `git ls-files`：那样工作树里未提交的新文件就没人管了。
      - name: gate3 - 内网基建地址必须归零
        run: |
          if grep -rIE 'gitlab\.ruishan\.cc' . --exclude-dir=.git \
               --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache; then
            echo "::error::内网基建地址混入了公开仓"
            exit 1
          fi
          echo "无内网基建地址 ✓"

      # ── 门禁④ scripts/ 不许有本机绝对路径 ─────────────────────────
      # 🔴 作用域只管 `scripts/`，模式是 `/Users/zhourusheng` 而非 `/Users/`：
      #   - 全仓扫 `/Users/` ⇒ reports/ 57 个文件命中，那是**历史证据**，改了就不是原始证据
      #   - 扫 tasks/ ⇒ 39/39 命中，那是**题面原文**（从真实轨迹反解），改它就改了题目
      # ⚠️ 排除 scripts/tests/：那里的路径是断言 fixture（map_repo_path 要验的就是这种输入），
      # 由单测 test_no_hardcoded_local_paths_in_scripts 用同一套白名单盯着。
      - name: gate4 - scripts/ 不许有本机绝对路径
        run: |
          if grep -rn '/Users/zhourusheng' scripts/ \
               --exclude-dir=tests --exclude-dir=__pycache__ \
               --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache; then
            echo "::error::scripts/ 里有本机绝对路径（P1-1 复发）"
            exit 1
          fi
          echo "scripts/ 无本机绝对路径 ✓"

      # ── 门禁⑤ 私有仓源码物料归零 ────────────────────────────────
      # 🔴 模式盯【私有仓文件路径形态】，⛔ 不许写裸 `iam-studio-fe`：
      # 那会误伤 reports/t4-env.md:103 与 card 第 12/13 条的**合规披露散文**
      # （解释 5 条为何被挡），门禁会永远红 ⇒ 然后被人关掉。
      # ⚠️ `scripts/tests/` 是白名单：test_mvp.py:145/953 的 fixture 就该带这种路径。
      # ⚠️ 选项写在路径操作数【之前】：GNU grep 两种都吃，但 BSD grep / ugrep 会把
      # 选项当文件名（实测 exit 2 且**排除失效**）⇒ 这样写本地与 CI 才是同一条命令。
      - name: gate5 - 私有仓源码物料归零
        run: |
          PAT='(anka-app|iam-studio-fe|tag-studio|ontology-studio)/[A-Za-z0-9_./-]*\.(vue|tsx|ts|json)|(anka-app|iam-studio-fe)/[A-Za-z0-9_.-]+/(src|packages)/'
          if grep -rIEn --exclude-dir=.git --exclude-dir=__pycache__ --exclude-dir=tests \
                  --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache -- "$PAT" . ; then
            echo "::error::检出私有仓源码物料（见 §6B）"; exit 1
          fi
          echo "✅ 私有仓源码物料 0 命中"

      # ── 门禁⑥ 全历史私有仓源码物料归零（§6C）────────────────────
      # 🔴 这一条补的是**门禁③④⑤ 的共同盲区**：它们都写着 `--exclude-dir=.git`
      # ⇒ 只看工作树，**永远看不见历史**。而 `git push` 推的是全部提交 ——
      # 6B 用「新增一个提交覆盖旧内容」的方式脱敏，五条门禁 + 六条判据全绿，
      # 但 clone 后 `git show HEAD~1:meta/resolved.jsonl` 一条命令就能取回 178 KB
      # 私有仓源码（实测）。⇒ 判据的作用域比风险面窄，与 6fe48cf 是同一类缺陷。
      #
      # ⚠️ 模式与门禁⑤ **逐字一致**，⛔ 别在这里写宽模式：裸 `iam-studio-fe`
      # 会误伤 reports/t4-env.md:103 的合规披露散文 ⇒ 门禁永远红然后被关掉。
      # ⚠️ 白名单同门禁⑤：`*/tests/*`（map_repo_path 的断言 fixture）+
      # reports/t4-env.md（解释 5 条为何被挡的散文）。
      # ⚠️ 第二段扫的是 meta/*.jsonl 的**非 repo 字段** —— snapshots.jsonl 的私有串是
      # **包名不是路径形态**，上面那个模式抓不到（§6B.5 末段已警告），靠这段兜。
      # ⛔ `repo` 字段本身不算残留：那是合规披露的事实（card 第 12/13 条已公开）。
      - name: gate6 - 全历史私有仓源码物料归零
        run: |
          # 🔴 `set -e` 必须显式写：GitHub Actions 默认 `bash -e {0}`，但本地 `bash gate6.sh`
          # 不带 -e ⇒ 下面那个 python 报红后**仍会往下走到 echo ✅ 并 exit 0**（实测踩过：
          # 反向自证时脚本明明点名了 3 个 blob，退出码却是 0）。不写它 ⇒ 本地自证是假绿。
          set -euo pipefail
          test "$(git rev-list --all | wc -l | tr -d ' ')" -gt 1 \
            || { echo "::error::只有 1 个提交 ⇒ checkout 缺 fetch-depth: 0，本门禁形同虚设"; exit 1; }
          python - <<'PY'
          import subprocess, re, json, collections, sys
          PAT = re.compile(rb'(anka-app|iam-studio-fe|tag-studio|ontology-studio)/[A-Za-z0-9_./-]*\.(vue|tsx|ts|json)'
                           rb'|(anka-app|iam-studio-fe)/[A-Za-z0-9_.-]+/(src|packages)/')
          PRIV = ('iam-studio-fe','anka-app','tag-studio','ontology-studio')
          objs = collections.defaultdict(set)
          for line in subprocess.run(['git','rev-list','--all','--objects'],
                                     capture_output=True,text=True).stdout.split('\n'):
              p = line.split(' ',1)
              if len(p)==2 and p[1]: objs[p[1]].add(p[0])
          bad1, bad2 = [], collections.Counter()
          for path, shas in objs.items():
              for s in shas:
                  if subprocess.run(['git','cat-file','-t',s],
                                    capture_output=True,text=True).stdout.strip()!='blob': continue
                  raw = subprocess.run(['git','cat-file','blob',s],capture_output=True).stdout
                  if not ('/tests/' in path or path.startswith('tests/') or path=='reports/t4-env.md'):
                      if PAT.search(raw): bad1.append((path, s[:8], len(PAT.findall(raw))))
                  if path.startswith('meta/') and path.endswith('.jsonl'):
                      try: txt = raw.decode('utf-8')
                      except UnicodeDecodeError: continue
                      for line2 in txt.split('\n'):
                          if not line2.strip(): continue
                          for k, v in json.loads(line2).items():
                              if k == 'repo': continue
                              t = v if isinstance(v,str) else json.dumps(v,ensure_ascii=False)
                              c = sum(t.count(pp) for pp in PRIV)
                              if c: bad2[f'{path}:{k}'] += c
          print(f"扫过 {sum(len(v) for v in objs.values())} 个对象 / {len(objs)} 个路径")
          if bad1: print(f"::error::全历史仍有私有仓源码物料: {bad1}")
          if bad2: print(f"::error::全历史仍有非 repo 字段残留: {dict(bad2)}")
          sys.exit(1 if (bad1 or bad2) else 0)
          PY
          echo "✅ 全历史私有仓源码物料 0 命中"

      # ── 门禁⑦ card 引用的仓内路径必须可达（或已声明为外部来源）──────
      # 🔴 补的是门禁①-⑥ 的共同盲区：它们盯的是「card 里的数字是不是现算的」，
      # 而这条盯「card 指的文件在不在」。实测一期漏了两条真断链
      # （`phase1/meta/*.stats.json`：card 印着取数源，公开仓却没有这两个文件），
      # 六条门禁一条都没拦住 —— 单测里 3 处 card 断言验的是条数与体积区间。
      #
      # 🔴 ⛔ 不许写成裸 exists() 检查：card 里有两条**刻意不入库**的引用
      #   （meta/batch-v0.2.json 含 8562 条会话 ID、reports/t8-rerun/tasks/ 1.9G），
      #   裸检查会报红，然后逼下一个人去把它们补进来 —— 那是一次真实泄漏。
      # ⚠️ 第三支（反向断言）不能省：没有它，白名单会退化成「把所有报红都登记进去」，
      #   门禁⑦ 就变成永久绿，与 `|| true` 同一个下坡。
      # ⚠️ 前缀表里必须含 phase1 —— 断链的那两条正是 `phase1/meta/...` 形态。
      #   漏了它，门禁⑦ 恰好扫不到本次要修的问题（实测：漏 phase1 时只报 2 条，
      #   补上后报 4 条）⇒ 一个「上线即假绿」的门禁。⛔ 修完也别删 phase1：
      #   删了就等于把「旧形态复发」这条判据关掉。
      - name: gate7 - card 取数源可达
        run: |
          # 🔴 同门禁⑥：`set -e` 必须显式写，否则本地跑时 python 报红仍会 exit 0（假绿）。
          set -euo pipefail
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          card = Path("DATASET_CARD.md").read_text(encoding="utf-8")
          ext = json.loads(Path("meta/external-sources.json").read_text(encoding="utf-8"))
          declared = {s["path"].rstrip("/") for s in ext["sources"]}
          # card 里反引号包裹的仓内路径（跳过含通配符与占位符的）
          cited = {p for p in re.findall(
                       r'`((?:meta|reports|tasks|scripts|pipeline|phase1)/[A-Za-z0-9_./-]+)`', card)
                   if "*" not in p}
          bad = [p for p in sorted(cited)
                 if not Path(p).exists() and p.rstrip("/") not in declared]
          # 反向：登记为外部来源的，不许真的存在
          stale = [p for p in sorted(declared) if Path(p).exists()]
          for p in bad:   print(f"::error::card 引用了不存在且未声明的路径: {p}")
          for p in stale: print(f"::error::external-sources 登记的 {p} 其实已入库 ⇒ 该删登记项")
          print(f"card 引用 {len(cited)} 条，已声明外部来源 {len(declared)} 条")
          sys.exit(1 if (bad or stale) else 0)
          PY
          echo "✅ card 取数源全部可达或已声明"

      # ── 门禁⑧ 未披露的内网仓名归零（二期新增）─────────────────────
      # 🔴 模式必须**逐仓枚举 8 个未披露仓**，⛔ 不许写 `ruijie/[a-z0-9-]+`：
      #   那会命中大量**已合规披露**的 `ruijie/iam-studio-fe`（card 第 2/13 条、
      #   meta/resolved.stats.json、meta/snapshots.jsonl、scripts/ 判定逻辑）
      #   ⇒ 门禁上线即红，然后被人加 `|| true` 关掉。同门禁⑤ 注释里警告过的坑。
      # ⚠️ 为什么 iam-studio-fe 可以留：card 第 13 条已公开披露「5 条 task 因私有
      #   registry 被排除」，它是**披露事实**；而这 8 个仓在题集里从未出现
      #   ⇒ 它们出现即泄漏。
      # ⚠️ 这条是二期新增：门禁⑤ 盯的是**私有仓文件路径形态**（私有仓名 + 前端源码后缀，
      #   这里不照抄那个形态 —— 举例写全会被门禁⑤ 自己扫到，实测踩过一次），
      #   而 repo_map.py 里是**裸仓名列表** ⇒ 实测门禁⑤ 对它 0 命中，无人看守。
      #   这也正是 pipeline/config/repos.example.json 只放 10 个已披露仓的理由。
      - name: gate8 - 未披露的内网仓名归零
        run: |
          PAT='ruijie/(frontend-source|iam-sid-fe-native|iam-space-template-fe|iam-third-party-fe-native|device-verify|iam-mda-fe-native|sid-vue-components|source-id-source)'
          if grep -rInE --exclude-dir=.git --exclude-dir=__pycache__ \
                  --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache -- "$PAT" . ; then
            echo "::error::未披露的内网仓名混入"; exit 1
          fi
          echo "✅ 无未披露内网仓名"

      # ── 门禁⑪ 全历史未披露内网仓名归零（本步骤实测补的）─────────────
      # 🔴 补的是**门禁⑥ 与门禁⑧ 之间的缝**，两条都盯不到它：
      #   - 门禁⑧ 逐仓枚举没错，但 `grep -r .` 只看**工作树** ⇒ 看不见历史；
      #   - 门禁⑥ 确实扫全历史，但它复用门禁⑤ 的**文件路径形态**模式
      #     （私有仓名 + 前端源码后缀），对**裸仓名列表**实测 0 命中。
      #   ⇒ 迁入清洗链路时实测踩到：改造① 把工作树的 18 行硬编码清单外置了，
      #     十条门禁全绿，但 7 个迁入提交的历史里清单原样留着，
      #     `git show <任一提交>:pipeline/s0/repo_map.py` 一条命令就能取回 8 个仓名。
      #     处置是导出时加一遍 `git filter-repo --replace-text`（换成 <私有仓N>）。
      # ⚠️ 判据用 `git grep <rev>`（读 blob），⛔ 不是 `grep -r`（读工作树）。
      # ⚠️ `git grep` 的 rev 必须写在模式**之后**、`--` 之前：
      #   写成 `git grep -- "$PAT" "$rev"` 会把 rev 当**路径** ⇒ 恒不命中（假绿，实测踩过）。
      # ⚠️ 与门禁⑧ 共用同一份枚举模式 —— 改一处必须改两处，
      #   ⛔ 别在这里放宽成 `ruijie/[a-z0-9-]+`：会命中已合规披露的 iam-studio-fe。
      - name: gate11 - 全历史未披露内网仓名归零
        run: |
          set -euo pipefail
          test "$(git rev-list --all | wc -l | tr -d ' ')" -gt 1 \
            || { echo "::error::只有 1 个提交 ⇒ checkout 缺 fetch-depth: 0，本门禁形同虚设"; exit 1; }
          PAT='ruijie/(frontend-source|iam-sid-fe-native|iam-space-template-fe|iam-third-party-fe-native|device-verify|iam-mda-fe-native|sid-vue-components|source-id-source)'
          bad=0
          for rev in $(git rev-list --all); do
            hits=$(git grep -IEl "$PAT" "$rev" -- 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::提交 $(git log -1 --format='%h %s' "$rev") 含未披露内网仓名："
              echo "$hits" | sed "s#^$rev:#    #"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "✅ 全历史（$(git rev-list --all | wc -l | tr -d ' ') 提交）无未披露内网仓名"

      # ── 门禁⑨ 全仓不许有绝对路径 symlink（§2.12）────────────────────
      # 🔴 grep 不读 symlink 的目标串 ⇒ 门禁③④⑤⑥⑧ 全都扫不到它。
      #   源仓就留着两个指向 /Users/zhourusheng/... 的 symlink，一期无人发现；
      #   迁移时它们会静默变成死链（指向的路径在别人机器上不存在）。
      # ⚠️ 判据读 git 索引里的 mode 120000 + blob 内容，不用 `test -L`：
      #   后者在 CI 的 checkout 里对已损坏的 symlink 也返回真，看不出目标是什么。
      - name: gate9 - 无绝对路径 symlink
        run: |
          set -euo pipefail
          bad=$(git ls-files -s | awk '$1=="120000"{print $4}' | while read -r f; do
                  t=$(git cat-file -p ":$f"); case "$t" in /*) echo "$f -> $t";; esac; done)
          if [ -n "$bad" ]; then echo "::error::绝对路径 symlink: $bad"; exit 1; fi
          echo "✅ 无绝对路径 symlink"

      # ── 门禁⑩ pipeline/ 必须零第三方依赖（二期新增）───────────────
      # 🔴 这是本层的卖点之一（pipeline/README.md 第 5 条对外承诺过）：别人 clone
      #   后跑单测只需 pytest，不必装 sklearn/jieba/numpy/openai。
      # ⚠️ 判据是「import 的顶层模块名 ∈ 标准库 ∪ 本层自己的模块」，
      #   ⛔ 不是「pip list 里有没有」——后者在装了全套依赖的机器上永远绿。
      # ⚠️ OWN 那几个是本层自己的模块（靠 sys.path.insert 或 spec 加载，不是第三方包）。
      # ⚠️ 只把 pytest 放进 tests/ 的白名单，⛔ 不整目录排除：
      #   否则测试文件里偷偷加的第三方依赖就没人管了。
      - name: gate10 - pipeline 零第三方依赖
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          OWN = {"common", "labeler", "repo_map", "s2_rules", "s3_segment"}
          DEV = {"pytest"}                      # 开发依赖，只在 tests/ 里允许
          std = set(sys.stdlib_module_names)    # Python 3.10+
          bad: dict[str, set[str]] = {}
          scanned = 0
          for f in sorted(Path("pipeline").rglob("*.py")):
              if "__pycache__" in f.parts:
                  continue
              scanned += 1
              allowed = std | OWN | (DEV if "tests" in f.parts else set())
              for n in ast.walk(ast.parse(f.read_text(encoding="utf-8"))):
                  if isinstance(n, ast.Import):
                      mods = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      mods = [n.module.split(".")[0]]
                  else:
                      continue
                  for m in mods:
                      if m not in allowed:
                          bad.setdefault(str(f), set()).add(m)
          for f, ms in sorted(bad.items()):
              print(f"::error::{f} 引入了第三方依赖: {sorted(ms)}")
          # 扫到 0 个文件也算红：形态是「路径写错 ⇒ 门禁永远绿」
          if not scanned:
              print("::error::pipeline/ 下没扫到 .py ⇒ 判据作用域错了"); sys.exit(1)
          print(f"扫描 {scanned} 个文件，{'发现' if bad else '未发现'}第三方依赖")
          sys.exit(1 if bad else 0)
          PY
          echo "✅ pipeline 零第三方依赖"

      # ── 单测 ───────────────────────────────────────────────────────
      # ⚠️ 没有原始轨迹与 mirror 的那几条会 skip 并**说明原因**，
      # ⛔ 不许因为 CI 里 skip 就把它们删掉：它们在采集机上是真跑的。
      - name: 单测
        run: |
          pip install --quiet pytest
          cd scripts && python -m pytest tests/test_mvp.py -q
      # ── pipeline 单测 ──────────────────────────────────────────────
      # ⚠️ 没有原始轨迹的那 2 条会 skip 并说明原因（实测 195 passed / 2 skipped）。
      # ⛔ 不许因为 CI 里 skip 就删掉它们 —— 在采集机上是真跑的。
      # 🔴 两层**分开跑**是刻意的：两层各有一个同名 common.py，同一进程里装两份会
      #   互相覆盖（§2.8）。两层的 conftest.py + 两条对称断言把这条纪律机器化了，
      #   一次收集两个目录也是绿的（实测两种顺序 398 passed / 6 skipped），
      #   但生产上两层从不同进程跑 ⇒ CI 也按生产形态分开跑。
      - name: 单测 - pipeline 清洗链路
        run: |
          cd pipeline && python -m pytest tests -q
